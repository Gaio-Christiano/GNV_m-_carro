name: Android Build Verified

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.12.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip

      - name: Dependencias Linux
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint libtool pkg-config cmake gettext libffi-dev libssl-dev libltdl-dev zlib1g-dev libncurses5-dev libncursesw5-dev
          python -m pip install --upgrade "pip<26.2" setuptools wheel
          python -m pip install buildozer==1.5.0 "Cython==0.29.34"

      - name: Preparar projeto Android
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        shell: bash
        run: |
          set -euxo pipefail
          test -f main.py
          test -f GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py
          test -f buildozer.spec
          python -m py_compile main.py GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py

          # Pillow somente e removido quando nao existe import PIL.
          if ! grep -R -nE '(^|[[:space:]])(from|import)[[:space:]]+PIL' --include='*.py' .; then
            sed -i -E 's/,?pillow,?//g; s/,,/,/g' buildozer.spec
          fi

          rm -rf p4a
          git init p4a
          git -C p4a remote add origin https://github.com/kivy/python-for-android.git
          git -C p4a fetch --depth 1 origin 58d21141f17c889bf8585f5665921d72028f8831
          git -C p4a checkout --detach FETCH_HEAD

          python - <<'PY'
          from pathlib import Path
          p = Path('p4a/pythonforandroid/recipes/freetype/__init__.py')
          text = p.read_text(encoding='utf-8')
          old = 'https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz'
          new = 'https://download-mirror.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz'
          if old not in text:
              raise SystemExit('Receita FreeType inesperada: URL original nao encontrada')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

          sed -i '/^[[:space:]]*android\.archs[[:space:]]*=/c\android.archs = arm64-v8a,x86_64' buildozer.spec
          grep -E '^(requirements|android\.archs|android\.api|android\.minapi|p4a\.)' buildozer.spec
          git -C p4a rev-parse HEAD
          test "$(git -C p4a rev-parse HEAD)" = "58d21141f17c889bf8585f5665921d72028f8831"

          FREETYPE_URL='https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz'
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors -o /tmp/freetype-2.14.1.tar.gz "$FREETYPE_URL"
          test -s /tmp/freetype-2.14.1.tar.gz
          test "$(sha256sum /tmp/freetype-2.14.1.tar.gz | awk '{print $1}')" = "174d9e53402e1bf9ec7277e22ec199ba3e55a6be2c0740cb18c0ee9850fc8c34"
          tar -tzf /tmp/freetype-2.14.1.tar.gz | grep -m1 'freetype-2.14.1/subprojects/dlg/include/dlg/output.h$'
          echo 'FreeType 2.14.1 validado: checksum e submodulo dlg presentes'

      - name: Limpar caches de builds anteriores
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf .buildozer bin

      - name: Build APK
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_full.log
          find bin -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Guardar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-ANDROID-VERIFIED
          path: |
            GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk
            GNV_V28_27_ANDROID_BUILD_FIX/build_full.log
            GNV_V28_27_ANDROID_BUILD_FIX/.buildozer/android/platform/build-*/dists/*/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Testar inicializacao no Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euxo pipefail
            APK="$(find '${{ github.workspace }}/GNV_V28_27_ANDROID_BUILD_FIX/bin' -maxdepth 1 -type f -name '*x86_64*.apk' -print -quit)"
            if [ -z "$APK" ]; then
              APK="$(find '${{ github.workspace }}/GNV_V28_27_ANDROID_BUILD_FIX/bin' -maxdepth 1 -type f -name '*.apk' -print -quit)"
            fi
            test -f "$APK"
            adb install -r "$APK"
            adb shell am force-stop br.com.gaiochristiano.gnvcalculator || true
            adb logcat -c
            adb shell monkey -p br.com.gaiochristiano.gnvcalculator 1
            sleep 5
            pid=$(adb shell pidof br.com.gaiochristiano.gnvcalculator 2>/dev/null | tr -d '\r' || true)
            if [ -z "$pid" ]; then
              adb logcat -d -v time > "${{ github.workspace }}/android_runtime.log" || true
              exit 1
            fi
            sleep 20
            pid=$(adb shell pidof br.com.gaiochristiano.gnvcalculator 2>/dev/null | tr -d '\r' || true)
            if [ -z "$pid" ]; then
              adb logcat -d -v time > "${{ github.workspace }}/android_runtime.log" || true
              exit 1
            fi
            adb logcat -d -t 800 | grep -E 'AndroidRuntime|FATAL EXCEPTION|gnvcalculator|python' || true

      - name: Guardar diagnóstico de runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-ANDROID-RUNTIME
          path: android_runtime.log
          if-no-files-found: warn
