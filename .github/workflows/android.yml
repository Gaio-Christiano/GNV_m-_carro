name: Build APK GNV e teste real Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-gnv:
    name: Compilar APK GNV
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.9"
          cache: pip

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint libtool pkg-config cmake gettext libffi-dev libssl-dev libltdl-dev zlib1g-dev libncurses5-dev libncursesw5-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade "pip<26.2" setuptools wheel
          python -m pip install buildozer "Cython==0.29.34"

      - name: Verificar arquivos e sintaxe
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          test -f main.py
          test -f GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py
          test -f buildozer.spec
          python -m py_compile main.py GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py

      - name: Preparar python-for-android
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf p4a
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git p4a
          python - <<'PY'
          from pathlib import Path
          p = Path("p4a/pythonforandroid/build.py")
          s = p.read_text(encoding="utf-8")
          old = "pip install -U pip"
          new = "python -m pip --version"
          if old in s:
              p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Compilar APK GNV
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf .buildozer bin
          buildozer -v android debug 2>&1 | tee build_full.log

      - name: Diagnóstico do build
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "=== DIAGNÓSTICO ==="
          python --version
          buildozer --version || true
          echo "=== APK ==="
          find bin -type f -name '*.apk' -print || true
          echo "=== ERROS ==="
          if [ -f build_full.log ]; then
            grep -nEi "error:|fatal error:|Command failed|Traceback|ImportError|ModuleNotFoundError|SSL|certificate" build_full.log | tail -200 || true
          fi

      - name: Upload log GNV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-BUILD-LOG
          path: GNV_V28_27_ANDROID_BUILD_FIX/build_full.log
          if-no-files-found: warn

      - name: Upload APK GNV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-APK-REAL
          path: GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk
          if-no-files-found: error

  runtime-test:
    name: Instalar e abrir APK em Android Emulator
    needs: build-gnv
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: GNV-APK-REAL
          path: apk

      - name: Preparar Android SDK e Emulator
        run: |
          set -e
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          rm -rf "$HOME/.android/avd/gnv-api35.avd" "$HOME/.android/avd/gnv-api35.ini"
          echo "no" | avdmanager create avd -n gnv-api35 -k "system-images;android-35;google_apis;x86_64" --force
          emulator -list-avds

      - name: Iniciar Android Emulator
        run: |
          set -u
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          : > emulator.log
          adb kill-server || true
          adb start-server

          echo "=== ACCELERAÇÃO ==="
          emulator -accel-check 2>&1 | tee accel-check.log || true

          echo "=== INICIANDO EMULADOR ==="
          nohup emulator -avd gnv-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -accel auto \
            > emulator.log 2>&1 &
          EMU_PID=$!
          echo "EMU_PID=$EMU_PID"

          echo "=== ESPERANDO PROCESSO DO EMULADOR ==="
          for i in $(seq 1 30); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "ERRO: o processo do emulador encerrou antes de disponibilizar o ADB."
              cat emulator.log || true
              exit 1
            fi
            sleep 1
          done

          echo "=== ESPERANDO ADB ==="
          DEVICE=""
          for i in $(seq 1 120); do
            DEVICE=$(adb devices | awk 'NR>1 && $2=="device" && $1 ~ /^emulator-/ {print $1; exit}')
            if [ -n "$DEVICE" ]; then
              echo "Dispositivo detectado: $DEVICE"
              break
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "ERRO: o emulador encerrou enquanto aguardava o ADB."
              cat emulator.log || true
              exit 1
            fi
            sleep 2
          done

          if [ -z "$DEVICE" ]; then
            echo "ERRO: o emulador não apareceu no ADB após 4 minutos."
            echo "=== ADB DEVICES ==="
            adb devices -l || true
            echo "=== PROCESSO ==="
            ps -ef | grep -E '[e]mulator.*gnv-api35' || true
            echo "=== EMULATOR LOG ==="
            cat emulator.log || true
            exit 1
          fi

          echo "=== ESPERANDO BOOT COMPLETO ==="
          BOOT_OK=0
          for i in $(seq 1 120); do
            boot=$(adb -s "$DEVICE" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "boot=$boot tentativa=$i"
            if [ "$boot" = "1" ]; then
              BOOT_OK=1
              break
            fi
            sleep 2
          done

          if [ "$BOOT_OK" != "1" ]; then
            echo "ERRO: o Android foi detectado pelo ADB, mas não terminou o boot."
            echo "=== ADB DEVICES ==="
            adb devices -l || true
            echo "=== BOOT PROPERTIES ==="
            adb -s "$DEVICE" shell getprop | grep -E 'sys.boot_completed|dev.bootcomplete|ro.boot|init.svc.bootanim' || true
            echo "=== LOGCAT ==="
            adb -s "$DEVICE" logcat -d -v time || true
            echo "=== EMULATOR LOG ==="
            tail -500 emulator.log || true
            exit 1
          fi

          adb -s "$DEVICE" shell settings put global window_animation_scale 0
          adb -s "$DEVICE" shell settings put global transition_animation_scale 0
          adb -s "$DEVICE" shell settings put global animator_duration_scale 0
          echo "ANDROID_EMULATOR_DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Instalar e iniciar aplicativo
        run: |
          set -e
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          DEVICE="${ANDROID_EMULATOR_DEVICE:-$(adb devices | awk 'NR>1 && $2=="device" && $1 ~ /^emulator-/ {print $1; exit}')}"
          APK=$(find apk -type f -name '*.apk' | head -1)
          test -n "$APK"
          test -n "$DEVICE"
          echo "APK=$APK"
          echo "DEVICE=$DEVICE"
          adb -s "$DEVICE" install -r "$APK"
          adb -s "$DEVICE" logcat -c
          adb -s "$DEVICE" shell monkey -p br.com.gaiochristiano.gnvcalculator 1
          sleep 20
          pid=$(adb -s "$DEVICE" shell pidof br.com.gaiochristiano.gnvcalculator 2>/dev/null | tr -d '\r' || true)
          echo "PID=$pid"
          if [ -z "$pid" ]; then
            echo "APLICATIVO ENCERRADO DURANTE A INICIALIZAÇÃO"
            adb -s "$DEVICE" logcat -d -v time || true
            exit 1
          fi
          echo "APLICATIVO PERMANECEU EM EXECUÇÃO POR 20 SEGUNDOS"

      - name: Diagnóstico Android
        if: always()
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          DEVICE="${ANDROID_EMULATOR_DEVICE:-$(adb devices | awk 'NR>1 && $2=="device" && $1 ~ /^emulator-/ {print $1; exit}')}"
          adb devices -l > adb_devices.txt 2>&1 || true
          adb logcat -d -v time > android_runtime.log 2>&1 || true
          if [ -n "$DEVICE" ]; then
            adb -s "$DEVICE" shell dumpsys package br.com.gaiochristiano.gnvcalculator > package_dump.txt 2>&1 || true
            adb -s "$DEVICE" shell dumpsys activity processes > activity_processes.txt 2>&1 || true
          else
            : > package_dump.txt
            : > activity_processes.txt
          fi
          cp accel-check.log accel_check_saved.log 2>/dev/null || true

      - name: Upload diagnóstico Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-ANDROID-RUNTIME-DIAGNOSTIC
          path: |
            android_runtime.log
            package_dump.txt
            activity_processes.txt
            emulator.log
            accel-check.log
            adb_devices.txt
          if-no-files-found: warn
