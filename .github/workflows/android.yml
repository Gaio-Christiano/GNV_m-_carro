name: Build APK GNV e teste real Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-gnv:
    name: Compilar APK GNV
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.9"
          cache: pip

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint libtool pkg-config cmake gettext libffi-dev libssl-dev libltdl-dev zlib1g-dev libncurses5-dev libncursesw5-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade "pip<26.2" setuptools wheel
          python -m pip install buildozer "Cython==0.29.34"

      - name: Verificar arquivos e sintaxe
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -euo pipefail
          test -f main.py
          test -f GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py
          test -f buildozer.spec
          python -m py_compile main.py GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py

      - name: Preparar python-for-android fixado
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -euo pipefail
          rm -rf p4a
          git init p4a
          git -C p4a remote add origin https://github.com/kivy/python-for-android.git
          git -C p4a fetch --depth 1 origin 58d21141f17c889bf8585f5665921d72028f8831
          git -C p4a checkout --detach FETCH_HEAD

          python - <<'PY'
          from pathlib import Path

          build_py = Path("p4a/pythonforandroid/build.py")
          text = build_py.read_text(encoding="utf-8")
          old = "pip install -U pip"
          new = "python -m pip --version"
          if old in text:
              build_py.write_text(text.replace(old, new), encoding="utf-8")

          # O servidor oficial Savannah está instável para este arquivo.
          # O snapshot da tag oficial do FreeType é um tar.gz válido e contém
          # exatamente o código da versão 2.14.1 usada pela receita.
          freetype = Path("p4a/pythonforandroid/recipes/freetype/__init__.py")
          text = freetype.read_text(encoding="utf-8")
          old_url = "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"
          new_url = "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz"
          if old_url not in text:
              raise SystemExit("URL original do FreeType não encontrada; abortando para não mascarar alteração inesperada no p4a")
          freetype.write_text(text.replace(old_url, new_url), encoding="utf-8")
          PY

          echo "=== P4A ==="
          git -C p4a rev-parse HEAD
          test "$(git -C p4a rev-parse HEAD)" = "58d21141f17c889bf8585f5665921d72028f8831"
          echo "=== FREETYPE URL ==="
          grep -n "github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" p4a/pythonforandroid/recipes/freetype/__init__.py

          FREETYPE_URL="https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz"
          curl -fL --retry 3 --retry-all-errors -o /tmp/freetype-2.14.1.tar.gz "$FREETYPE_URL"
          test -s /tmp/freetype-2.14.1.tar.gz
          tar -tzf /tmp/freetype-2.14.1.tar.gz >/dev/null
          echo "FreeType 2.14.1: download e validação OK"

      - name: Compilar APK GNV
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -o pipefail
          rm -rf .buildozer bin
          buildozer -v android debug 2>&1 | tee build_full.log

      - name: Diagnóstico do build
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "=== DIAGNÓSTICO ==="
          python --version
          buildozer --version || true
          echo "=== APK ==="
          find bin -type f -name '*.apk' -print || true
          echo "=== ERROS ==="
          if [ -f build_full.log ]; then
            grep -nEi "error:|fatal error:|Command failed|Traceback|ImportError|ModuleNotFoundError|HTTP Error|SSL|certificate|FreeType|freetype" build_full.log | tail -300 || true
          fi

      - name: Upload log GNV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-BUILD-LOG
          path: GNV_V28_27_ANDROID_BUILD_FIX/build_full.log
          if-no-files-found: warn

      - name: Upload APK GNV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-APK-REAL
          path: GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk
          if-no-files-found: error

  runtime-test:
    name: Instalar e abrir APK em Android Emulator
    needs: build-gnv
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: GNV-APK-REAL
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Android Emulator com teste real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: ${{ github.workspace }}
          script: |
            set -euxo pipefail
            APK=$(find "${GITHUB_WORKSPACE}/apk" -type f -name '*.apk' -print -quit)
            test -n "$APK"
            echo "APK=$APK"
            adb devices -l
            adb install -r "$APK"
            adb shell pm clear br.com.gaiochristiano.gnvcalculator || true
            adb logcat -c
            echo "=== INICIANDO APLICATIVO ==="
            adb shell monkey -p br.com.gaiochristiano.gnvcalculator 1
            sleep 5
            echo "=== PROCESSO APÓS 5s ==="
            pid=$(adb shell pidof br.com.gaiochristiano.gnvcalculator 2>/dev/null | tr -d '\r' || true)
            echo "PID=$pid"
            if [ -z "$pid" ]; then
              echo "APLICATIVO ENCERRADO DURANTE A INICIALIZAÇÃO"
              adb logcat -d -v time > "${GITHUB_WORKSPACE}/android_runtime.log" || true
              adb shell dumpsys package br.com.gaiochristiano.gnvcalculator > "${GITHUB_WORKSPACE}/package_dump.txt" || true
              adb shell dumpsys activity activities > "${GITHUB_WORKSPACE}/activity_dump.txt" || true
              exit 1
            fi
            sleep 20
            echo "=== PROCESSO APÓS 25s ==="
            pid=$(adb shell pidof br.com.gaiochristiano.gnvcalculator 2>/dev/null | tr -d '\r' || true)
            echo "PID=$pid"
            if [ -z "$pid" ]; then
              echo "APLICATIVO ENCERRADO ANTES DE 25s"
              adb logcat -d -v time > "${GITHUB_WORKSPACE}/android_runtime.log" || true
              adb shell dumpsys package br.com.gaiochristiano.gnvcalculator > "${GITHUB_WORKSPACE}/package_dump.txt" || true
              adb shell dumpsys activity activities > "${GITHUB_WORKSPACE}/activity_dump.txt" || true
              exit 1
            fi
            echo "APLICATIVO PERMANECEU EXECUTANDO POR 25s"
            adb logcat -d -v time > "${GITHUB_WORKSPACE}/android_runtime.log" || true
            adb shell dumpsys package br.com.gaiochristiano.gnvcalculator > "${GITHUB_WORKSPACE}/package_dump.txt" || true
            adb shell dumpsys activity activities > "${GITHUB_WORKSPACE}/activity_dump.txt" || true

      - name: Publicar diagnóstico Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-ANDROID-RUNTIME-DIAGNOSTIC
          path: |
            android_runtime.log
            package_dump.txt
            activity_dump.txt
          if-no-files-found: warn
