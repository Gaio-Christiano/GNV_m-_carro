name: Build APK GNV V28.27

on:
  workflow_dispatch:

jobs:

  build:

    name: Compilar APK GNV V28.27

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'
          cache: 'pip'

      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache \
            lbzip2 \
            wget \
            patch \
            make \
            gcc \
            g++

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "Cython==0.29.33"

      - name: Verify Buildozer
        run: |
          python --version
          buildozer --version
          cython --version

      - name: Verify project files
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "===== PROJETO ====="
          pwd
          ls -lah
          echo ""
          echo "===== BUILDOZER.SPEC ====="
          cat buildozer.spec

      - name: Check Python source
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          python -m py_compile main.py
          echo "main.py compilou corretamente."

      - name: Clean Buildozer
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          buildozer android clean || true

      - name: Build APK
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          buildozer -v android debug

      - name: Find APK
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "===== PROCURANDO APK ====="
          find . -type f -name "*.apk" -print
          echo ""
          echo "===== BIN ====="
          ls -lah bin || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-V28.27-APK
          path: GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk
          if-no-files-found: error

          