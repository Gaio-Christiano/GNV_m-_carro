name: Build APK GNV e teste real Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-gnv:
    name: Compilar APK GNV
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.9"
          cache: pip

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint libtool pkg-config cmake gettext libffi-dev libssl-dev libltdl-dev zlib1g-dev libncurses5-dev libncursesw5-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade "pip<26.2" setuptools wheel
          python -m pip install buildozer "Cython==0.29.34"

      - name: Verificar arquivos e sintaxe
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          test -f main.py
          test -f GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py
          test -f buildozer.spec
          python -m py_compile main.py GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py

      - name: Preparar python-for-android
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf p4a
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git p4a
          python - <<'PY'
          from pathlib import Path
          p = Path("p4a/pythonforandroid/build.py")
          s = p.read_text(encoding="utf-8")
          old = "pip install -U pip"
          new = "python -m pip --version"
          if old in s:
              p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Compilar APK GNV
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf .buildozer bin
          buildozer -v android debug 2>&1 | tee build_full.log

      - name: Diagnóstico do build
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "=== DIAGNÓSTICO ==="
          python --version
          buildozer --version || true
          echo "=== APK ==="
          find bin -type f -name '*.apk' -print || true
          echo "=== ERROS ==="
          if [ -f build_full.log ]; then
            grep -nEi "error:|fatal error:|Command failed|Traceback|ImportError|ModuleNotFoundError|SSL|certificate" build_full.log | tail -200 || true
          fi

      - name: Upload log GNV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-BUILD-LOG
          path: GNV_V28_27_ANDROID_BUILD_FIX/build_full.log
          if-no-files-found: warn

      - name: Upload APK GNV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-APK-REAL
          path: GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk
          if-no-files-found: error

  runtime-test:
    name: Instalar e abrir APK em Android Emulator
    needs: build-gnv
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: GNV-APK-REAL
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Android Emulator com teste real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -e
            APK=$(find apk -type f -name '*.apk' | head -1)
            test -n "$APK"
            echo "APK=$APK"
            adb devices -l
            adb install -r "$APK"
            adb logcat -c
            echo "=== INICIANDO APLICATIVO ==="
            adb shell monkey -p br.com.gaiochristiano.gnvcalculator 1
            sleep 20
            echo "=== VERIFICANDO PROCESSO ==="
            pid=$(adb shell pidof br.com.gaiochristiano.gnvcalculator 2>/dev/null | tr -d '\r' || true)
            echo "PID=$pid"
            adb shell dumpsys package br.com.gaiochristiano.gnvcalculator || true
            if [ -z "$pid" ]; then
              echo "APLICATIVO ENCERRADO DURANTE A INICIALIZAÇÃO"
              adb logcat -d -v time | tee android_runtime.log
              exit 1
            fi
            echo "APLICATIVO PERMANECEU EM EXECUÇÃO POR 20 SEGUNDOS"
            adb logcat -d -v time > android_runtime.log

      - name: Publicar diagnóstico Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-ANDROID-RUNTIME-DIAGNOSTIC
          path: |
            android_runtime.log
            apk/*.apk
          if-no-files-found: warn
