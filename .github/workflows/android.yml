name: Build APK GNV V28.27

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK GNV V28.27
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.9"
          cache: pip

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint libtool pkg-config cmake gettext libffi-dev libssl-dev libltdl-dev zlib1g-dev libncurses5-dev libncursesw5-dev

      - name: Verificar Python
        run: |
          python --version
          python -m pip --version

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade "pip<26.2" setuptools wheel
          python -m pip install buildozer "Cython==0.29.34"

      - name: Verificar arquivos
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          test -f main.py
          test -f GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py
          test -f buildozer.spec
          echo "Arquivos Android OK"

      - name: Preparar python-for-android corrigido
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf p4a
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git p4a
          P4A_BUILD="$PWD/p4a/pythonforandroid/build.py"
          test -f "$P4A_BUILD"
          echo "=== LINHA ORIGINAL ==="
          grep -n "pip install -U pip" "$P4A_BUILD" || true
          python - <<'PY'
          from pathlib import Path
          p = Path("p4a/pythonforandroid/build.py")
          s = p.read_text()
          old = "pip install -U pip"
          new = "pip install --force-reinstall --no-cache-dir 'pip==25.3'"
          if old not in s:
              raise SystemExit("ERRO: comando de atualização do pip não encontrado em python-for-android")
          p.write_text(s.replace(old, new))
          print("Patch aplicado: pip==25.3 com force-reinstall")
          PY
          echo "=== LINHA CORRIGIDA ==="
          grep -n "pip install.*pip" "$P4A_BUILD" | tail -5

      - name: Mostrar configuração
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: cat buildozer.spec

      - name: Limpar build anterior
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf .buildozer bin
          mkdir -p bin

      - name: Compilar APK
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -o pipefail
          echo "Usando p4a local corrigido: $PWD/p4a"
          buildozer -v android debug 2>&1 | tee build_full.log

      - name: Diagnostico
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "=== DIAGNOSTICO ==="
          python --version
          buildozer --version || true
          if [ -f build_full.log ]; then
            echo "=== ERROS ==="
            grep -nEi "error:|fatal error:|make: \*\*\*|Error code|Command failed|Traceback|ImportError" build_full.log | tail -200 || true
            echo "=== PIP INTERNAL ==="
            grep -nEi "pip install.*pip|Successfully installed pip|pip 26|pip 25\.3|open_rich_spinner" build_full.log | tail -100 || true
            echo "=== NDK API ==="
            grep -n -- "--ndk-api=" build_full.log | tail -20 || true
          fi
          echo "=== APKs ==="
          find . -type f -name "*.apk" -print || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-V28.27-BUILD-LOG
          path: GNV_V28_27_ANDROID_BUILD_FIX/build_full.log
          if-no-files-found: error

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-V28.27-APK
          path: GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk
          if-no-files-found: error
