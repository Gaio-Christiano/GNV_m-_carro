name: Android 12 - teste real de runtime do GNV

on:
  workflow_dispatch:
  push:
    paths:
      - 'GNV_V28_27_ANDROID_BUILD_FIX/**'
      - '.github/workflows/android-runtime-test.yml'

jobs:
  build-and-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint libtool pkg-config cmake gettext libffi-dev libssl-dev libltdl-dev zlib1g-dev libncurses5-dev libncursesw5-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade 'pip<26.2' setuptools wheel
          python -m pip install buildozer 'Cython==0.29.34'

      - name: Fixar p4a na release oficial v2026.05.09
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf p4a .buildozer bin
          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git p4a
          python - <<'PY'
          from pathlib import Path
          p = Path('p4a/pythonforandroid/build.py')
          s = p.read_text()
          s = s.replace('pip install -U pip', 'python -m pip --version')
          p.write_text(s)
          PY
          git -C p4a rev-parse HEAD

      - name: Verificar source e sintaxe
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          python -m py_compile main.py GNV14_REPARADO_V28_27_CORRIGIDO_CARD_FISICO_ANP_Z.py
          grep -n '^requirements\|^android.api\|^android.minapi\|^android.ndk\|^version' buildozer.spec

      - name: Compilar APK
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          buildozer -v android debug 2>&1 | tee runtime_build.log

      - name: Instalar ferramentas do emulator Android 12
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-31' 'system-images;android-31;google_apis;x86_64'

      - name: Criar e iniciar emulator Android 12
        run: |
          echo 'no' | avdmanager create avd -n gnv-api31 -k 'system-images;android-31;google_apis;x86_64' --force
          emulator -avd gnv-api31 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 150); do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$booted" = '1' ] && break
            sleep 2
          done
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk

      - name: Instalar APK e executar por 30 segundos
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          apk_file=$(find bin -type f -name '*.apk' | head -1)
          test -n "$apk_file"
          adb install -r "$apk_file"
          adb logcat -c
          adb shell monkey -p br.com.gaiochristiano.gnvcalculator 1
          sleep 30
          adb logcat -d > runtime_android12.log
          echo '========== LOG DE ERRO =========='
          grep -nEi 'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|UnsatisfiedLinkError|ImportError|ModuleNotFoundError|Traceback|Python.*Error|Process.*died|dlopen failed|could not find' runtime_android12.log || true
          echo '========== KIVY/PYTHON =========='
          grep -nEi 'kivy|python|sdl|main.py|GNV' runtime_android12.log | tail -250 || true
          echo '========== ATIVIDADE =========='
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|br.com.gaiochristiano.gnvcalculator' || true
          if grep -qEi 'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|UnsatisfiedLinkError|ImportError|ModuleNotFoundError|Traceback|dlopen failed' runtime_android12.log; then
            echo 'FAIL: crash detectado no Android 12 emulator'
            exit 1
          fi

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV-ANDROID12-RUNTIME-DIAGNOSTICO
          path: |
            GNV_V28_27_ANDROID_BUILD_FIX/runtime_build.log
            GNV_V28_27_ANDROID_BUILD_FIX/runtime_android12.log
            emulator.log
          if-no-files-found: warn
