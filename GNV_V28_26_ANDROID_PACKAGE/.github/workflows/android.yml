name: Build APK GNV V28.27

on:
  workflow_dispatch:

jobs:

  build:

    name: Compilar APK GNV V28.27

    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 2. PYTHON 3.12.9
      # ==========================================================

      - name: Setup Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'


      # ==========================================================
      # 3. VERIFICAR PYTHON
      # ==========================================================

      - name: Verify Python
        run: |

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          python -c "import sys; print(sys.executable)"

          python -m pip --version


      # ==========================================================
      # 4. DEPENDENCIAS DO UBUNTU
      # ==========================================================

      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache \
            lbzip2 \
            wget \
            patch


      # ==========================================================
      # 5. JAVA
      # ==========================================================

      - name: Verify Java
        run: |

          echo "JAVA_HOME=$JAVA_HOME"

          java -version


      # ==========================================================
      # 6. PIP / SETUPTOOLS
      # ==========================================================

      - name: Install Python build tools
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel


      # ==========================================================
      # 7. CYTHON
      # ==========================================================

      - name: Install Cython
        run: |

          python -m pip install "Cython==0.29.33"


      # ==========================================================
      # 8. PYTHON-FOR-ANDROID
      # ==========================================================

      - name: Install python-for-android
        run: |

          python -m pip install \
            "python-for-android==2024.1.21"


      # ==========================================================
      # 9. BUILDOZER
      # ==========================================================

      - name: Install Buildozer
        run: |

          python -m pip install \
            "buildozer==1.5.0"


      # ==========================================================
      # 10. VERIFICAR VERSÕES
      # ==========================================================

      - name: Verify Android build tools
        run: |

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo "=========================================="
          echo "CYTHON"
          echo "=========================================="

          cython --version

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo "=========================================="
          echo "PYTHON-FOR-ANDROID"
          echo "=========================================="

          python -m pip show python-for-android


      # ==========================================================
      # 11. VERIFICAR PROJETO
      # ==========================================================

      - name: Verify project files
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |

          echo "=========================================="
          echo "DIRETORIO"
          echo "=========================================="

          pwd

          echo "=========================================="
          echo "ARQUIVOS"
          echo "=========================================="

          find . -maxdepth 2 -type f -print

          echo "=========================================="
          echo "BUILDOZER.SPEC"
          echo "=========================================="

          cat buildozer.spec


      # ==========================================================
      # 12. TESTAR MAIN.PY
      # ==========================================================

      - name: Test main.py
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |

          python -m py_compile main.py

          echo "=========================================="
          echo "main.py OK"
          echo "=========================================="


      # ==========================================================
      # 13. GARANTIR NDK 28C
      # ==========================================================

      - name: Install Android NDK 28c
        run: |

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"


      # ==========================================================
      # 14. CONFIGURAR NDK
      # ==========================================================

      - name: Configure Android environment
        run: |

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"

          echo "ANDROIDMINAPI=23" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="

          "$NDK_PATH/ndk-build" --version || true

          cat "$NDK_PATH/source.properties"


      # ==========================================================
      # 15. LIMPAR BUILD ANTERIOR
      # ==========================================================

      - name: Clean Build
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |

          rm -rf .buildozer

          rm -rf bin

          mkdir -p bin


      # ==========================================================
      # 16. COMPILAR APK
      # ==========================================================

      - name: Build APK
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |

          buildozer -v android debug


      # ==========================================================
      # 17. PROCURAR APK
      # ==========================================================

      - name: Find generated APK
        if: always()
        run: |

          echo "=========================================="
          echo "APK ENCONTRADOS"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================================
      # 18. MOSTRAR BIN
      # ==========================================================

      - name: List APK directory
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |

          echo "=========================================="
          echo "BIN"
          echo "=========================================="

          ls -lah bin || true


      # ==========================================================
      # 19. GERAR ARQUIVO DE LOG
      # ==========================================================

      - name: Collect build information
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |

          mkdir -p build_logs

          echo "GNV V28.27 BUILD INFORMATION" \
            > build_logs/build_environment.txt

          echo "" \
            >> build_logs/build_environment.txt

          echo "Python:" \
            >> build_logs/build_environment.txt

          python --version \
            >> build_logs/build_environment.txt 2>&1

          echo "" \
            >> build_logs/build_environment.txt

          echo "Buildozer:" \
            >> build_logs/build_environment.txt

          buildozer --version \
            >> build_logs/build_environment.txt 2>&1 || true

          echo "" \
            >> build_logs/build_environment.txt

          echo "NDK:" \
            >> build_logs/build_environment.txt

          echo "$ANDROID_NDK_HOME" \
            >> build_logs/build_environment.txt

          echo "" \
            >> build_logs/build_environment.txt

          echo "APK:" \
            >> build_logs/build_environment.txt

          find . \
            -type f \
            -name "*.apk" \
            -print \
            >> build_logs/build_environment.txt 2>&1 || true


      # ==========================================================
      # 20. UPLOAD APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: GNV-V28.27-APK

          path: |
            GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk

          if-no-files-found: error


      # ==========================================================
      # 21. UPLOAD DIAGNOSTICO
      # ==========================================================

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: GNV-V28.27-DIAGNOSTICO

          path: |
            GNV_V28_27_ANDROID_BUILD_FIX/build_logs/**
            GNV_V28_27_ANDROID_BUILD_FIX/.buildozer/android/platform/python-for-android/**/config.log
            GNV_V28_27_ANDROID_BUILD_FIX/.buildozer/android/platform/python-for-android/**/build.log

          if-no-files-found: warn
          

          