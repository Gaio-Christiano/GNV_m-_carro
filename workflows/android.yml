name: Build APK GNV V28.27
on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK GNV V28.27
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12.9 EXATO
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'
          cache: pip

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias do sistema
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Instalar Buildozer
        run: |
          set -euxo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.34" virtualenv

      - name: Preparar pacote
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -euxo pipefail
          test -f buildozer.spec
          unset ANDROIDNDK ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT || true
          if [ ! -f main.py ]; then
            candidate="$(find . -maxdepth 1 -type f -iname '*.py' ! -name 'main.py' ! -name 'test_*.py' | sort | head -1)"
            test -n "$candidate"
            cp "$candidate" main.py
            echo "main.py criado a partir de $candidate"
          fi
          rm -rf .buildozer
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|log_level)' buildozer.spec || true

      - name: Build APK com log completo
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -o pipefail
          rm -f build_full.log
          {
            echo "===== BUILD GNV V28.27 ====="
            date -u
            python --version
            python -c "import sys; print(sys.executable); print(sys.version)"
            buildozer -v android debug
          } 2>&1 | tee build_full.log
          status=${PIPESTATUS[0]}
          echo "BUILD_STATUS=$status" | tee -a build_full.log
          exit "$status"

      - name: Diagnostico SEMPRE
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set +e
          {
            echo "===== DIAGNOSTICO ====="
            python --version
            buildozer --version
            echo
            echo "===== ERROS ====="
            grep -nEi 'error:|fatal error:|make: \*\*\*|command failed|Error code|Traceback|failed|No such file|not found' build_full.log | tail -250
            echo
            echo "===== DIRETORIOS p4a ====="
            find .buildozer/android/platform -maxdepth 4 -type d 2>/dev/null | grep -E 'python-for-android|build-arm64|dists' | head -200
          } > diagnostic_summary.txt
          cat diagnostic_summary.txt
          mkdir -p diagnostic_artifact
          cp -f build_full.log diagnostic_summary.txt diagnostic_artifact/ 2>/dev/null || true
          find .buildozer -type f \( -name '*.log' -o -name 'config.log' \) -exec cp --parents {} diagnostic_artifact/ \; 2>/dev/null || true
          tar -czf gnv_v28_27_build_diagnostics.tar.gz diagnostic_artifact 2>/dev/null || true

      - name: Upload logs SEMPRE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV_V28_27_BUILD_DIAGNOSTICS
          path: |
            GNV_V28_27_ANDROID_BUILD_FIX/build_full.log
            GNV_V28_27_ANDROID_BUILD_FIX/diagnostic_summary.txt
            GNV_V28_27_ANDROID_BUILD_FIX/gnv_v28_27_build_diagnostics.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Procurar APK
        if: success()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -euxo pipefail
          find . -type f -name '*.apk' -print
          test -n "$(find . -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GNV_V28_27_APK
          path: GNV_V28_27_ANDROID_BUILD_FIX/**/bin/*.apk
          if-no-files-found: error
          retention-days: 30



          

          
            
          
