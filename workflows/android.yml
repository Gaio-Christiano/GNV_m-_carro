name: Build APK GNV V28.27

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK GNV V28.27
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # 1. BAIXAR O PROJETO
      # ============================================================
      - name: Checkout do projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. ANDROID SDK
      #
      # IMPORTANTE:
      # Não usamos sdkmanager antes desta etapa.
      # Esta action instala as Command-line Tools e coloca
      # sdkmanager no PATH.
      # ============================================================
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"


      # ============================================================
      # 5. VERIFICAR SDKMANAGER
      #
      # Se isto falhar, NÃO começamos uma compilação de 30 minutos.
      # O workflow para imediatamente mostrando o problema.
      # ============================================================
      - name: Verificar ambiente Android
        run: |
          echo "=========================================="
          echo "VERIFICANDO ANDROID SDK"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-não definido}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-não definido}"

          echo ""
          echo "SDKMANAGER:"
          command -v sdkmanager

          echo ""
          sdkmanager --version

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "PYTHON:"
          python --version

          echo ""
          echo "=========================================="
          echo "AMBIENTE ANDROID OK"
          echo "=========================================="


      # ============================================================
      # 6. DEPENDÊNCIAS DO LINUX
      # ============================================================
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            gettext \
            libltdl-dev


      # ============================================================
      # 7. INSTALAR BUILDZEOER
      # ============================================================
      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer


      # ============================================================
      # 8. ENTRAR NA PASTA DO PROJETO ANDROID
      # ============================================================
      - name: Verificar projeto
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "=========================================="
          echo "ARQUIVOS DO PROJETO"
          echo "=========================================="

          pwd

          echo ""
          echo "Arquivos:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "=========================================="
          echo "BUILDZER.SPEC"
          echo "=========================================="

          cat buildozer.spec


      # ============================================================
      # 9. LIMPAR BUILD ANTERIOR
      # ============================================================
      - name: Limpar compilação anterior
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ============================================================
      # 10. COMPILAR APK
      #
      # ATENÇÃO:
      # Não chamamos sdkmanager manualmente aqui.
      # O Android SDK já foi preparado acima.
      # ============================================================
      - name: Compilar APK GNV V28.27
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          set -o pipefail

          echo "=========================================="
          echo "INICIANDO BUILD APK"
          echo "=========================================="

          buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # 11. MOSTRAR RESULTADO
      # ============================================================
      - name: Verificar APK
        if: always()
        working-directory: GNV_V28_27_ANDROID_BUILD_FIX
        run: |
          echo "=========================================="
          echo "RESULTADO DA COMPILAÇÃO"
          echo "=========================================="

          echo ""
          echo "Conteúdo de bin/:"
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

          echo ""
          echo "APKs encontrados:"
          find . -type f -name "*.apk" -print 2>/dev/null || true


      # ============================================================
      # 12. GUARDAR LOG MESMO SE A COMPILAÇÃO FALHAR
      # ============================================================
      - name: Upload dos logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GNV_V28_27_LOGS
          path: |
            GNV_V28_27_ANDROID_BUILD_FIX/build.log
            GNV_V28_27_ANDROID_BUILD_FIX/.buildozer/**/*.log
          if-no-files-found: warn


      # ============================================================
      # 13. ENVIAR APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GNV_V28_27_APK
          path: |
            GNV_V28_27_ANDROID_BUILD_FIX/bin/*.apk
          if-no-files-found: error
          

          

          
            
          
