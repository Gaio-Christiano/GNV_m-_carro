name: Build APK Android - GNV V28.26

on:
  workflow_dispatch:

jobs:

  build:

    name: Compilar APK GNV V28.26

    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1 - BAIXAR O REPOSITORIO
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 2 - PYTHON DO AMBIENTE DE COMPILACAO
      # ==========================================================

      - name: Setup Python 3.12.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'
          cache: pip


      # ==========================================================
      # 3 - VERIFICAR PYTHON
      # ==========================================================

      - name: Verify Python
        run: |
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          python -c "import sys; print(sys.executable)"

          python -m pip --version


      # ==========================================================
      # 4 - DEPENDENCIAS DO UBUNTU
      # ==========================================================

      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache \
            lbzip2 \
            wget \
            patch \
            gettext


      # ==========================================================
      # 5 - JAVA
      # ==========================================================

      - name: Verify Java
        run: |

          java -version

          javac -version


      # ==========================================================
      # 6 - FERRAMENTAS PYTHON
      # ==========================================================

      - name: Install Python build tools
        run: |

          python -m pip install --upgrade pip

          python -m pip install setuptools wheel


      # ==========================================================
      # 7 - BUILDOZER
      # ==========================================================

      - name: Install Buildozer
        run: |

          python -m pip install buildozer


      # ==========================================================
      # 8 - CYTHON
      # ==========================================================

      - name: Install Cython
        run: |

          python -m pip install "Cython==0.29.34"


      # ==========================================================
      # 9 - CONFERIR FERRAMENTAS
      # ==========================================================

      - name: Verify Build tools
        run: |

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo "=========================================="
          echo "CYTHON"
          echo "=========================================="

          cython --version


      # ==========================================================
      # 10 - TESTAR main.py
      # ==========================================================

      - name: Check Python source
        working-directory: GNV_V28_26_ANDROID_PACKAGE
        run: |

          python -m py_compile main.py

          echo "main.py compilou corretamente."


      # ==========================================================
      # 11 - CONFERIR BUILDOZER.SPEC
      # ==========================================================

      - name: Show Buildozer configuration
        working-directory: GNV_V28_26_ANDROID_PACKAGE
        run: |

          echo "=========================================="
          echo "BUILDOZER.SPEC"
          echo "=========================================="

          cat buildozer.spec


      # ==========================================================
      # 12 - LIMPAR COMPILACOES ANTERIORES
      # ==========================================================

      - name: Clean Buildozer
        working-directory: GNV_V28_26_ANDROID_PACKAGE
        run: |

          rm -rf .buildozer

          rm -rf bin

          echo "Build anterior removido."


      # ==========================================================
      # 13 - COMPILAR APK
      # ==========================================================

      - name: Build APK
        working-directory: GNV_V28_26_ANDROID_PACKAGE
        run: |

          echo "=========================================="
          echo "INICIANDO BUILD ANDROID"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================================
      # 14 - MOSTRAR RESULTADO
      # ==========================================================

      - name: List generated APK
        if: always()
        working-directory: GNV_V28_26_ANDROID_PACKAGE
        run: |

          echo "=========================================="
          echo "ARQUIVOS APK"
          echo "=========================================="

          find . -type f -name "*.apk" -print || true

          echo ""

          ls -lah bin || true


      # ==========================================================
      # 15 - PUBLICAR APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:

          name: GNV-V28.26-APK

          path: GNV_V28_26_ANDROID_PACKAGE/bin/*.apk

          if-no-files-found: error
              